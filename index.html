<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>still, us.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- PASSWORD -->
<div id="password-screen">
  <div class="box">
    <h2>Enter the key</h2>
    <input type="password" id="password" placeholder="password">
    <button id="enter-btn">Enter</button>
    <p id="error"></p>
  </div>
</div>

<!-- MAIN -->
<div id="main-content" style="display:none;">

  <!-- MUSIC -->
  <audio id="bg-music" loop src="music.mp3"></audio>

  <section class="section center">
    <h1>6 months of us…</h1>
    <p>and somehow it still feels like the beginning.</p>
  </section>

  <section class="section">
    <p class="reveal">It started as something small…</p>
    <p class="reveal">just random conversations…</p>
    <p class="reveal">and somehow you became something I never expected…</p>
    <p class="reveal">and now you’re part of my everyday…</p>
  </section>

  <section class="section center">
    <h2>Happy 6 months ❤️</h2>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
