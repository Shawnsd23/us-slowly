<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>still, us.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- PARTICLES -->
<div class="particles"></div>

<!-- PASSWORD -->
<div id="password-screen">
  <div class="glass">
    <h2>Only us.</h2>
    <input type="password" id="password" placeholder="Enter password">
    <button id="enter">Enter</button>
    <p id="error"></p>
  </div>
</div>

<!-- MAIN -->
<div id="main" class="hidden">

<audio id="music" src="music.mp3" loop></audio>

<section class="center">
  <h1 class="title">still, us.</h1>
  <p>6 months of something I never planned…</p>
</section>

<section>
  <p class="reveal">I wasn’t looking for you…</p>
  <p class="reveal">and somehow… you happened.</p>
  <p class="reveal">slowly… quietly…</p>
  <p class="reveal">and now you feel like home.</p>
</section>

<section class="center">
  <h2>moments.</h2>

  <div class="polaroids">
    <div class="card"><img src="img1.jpg"><p>this one.</p></div>
    <div class="card"><img src="img2.jpg"><p>you smiling.</p></div>
    <div class="card"><img src="img3.jpg"><p>mine.</p></div>
  </div>
</section>

<section class="center">
  <p class="final">
    I don’t need perfect.<br>
    I just need this…<br>
    with you.
  </p>
</section>

<section class="center">
  <h2>Happy 6 months ❤️</h2>
</section>

</div>

<script src="script.js"></script>
</body>
</html>
