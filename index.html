<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our 6 Months ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="lock-screen">
        <div class="lock-card">
            <h2>Our Private Memories</h2>
            <p>Enter our special 4-digit date to enter</p>
            <input type="password" id="passInput" placeholder="MMDD">
            <button onclick="checkPass()">Unlock My Heart</button>
        </div>
    </div>

    <div id="main-content" class="hidden">
        <header>
            <h1 class="fade-in">Happy 6 Months, Beautiful!</h1>
            <p class="subtitle">180 Days of Us</p>
        </header>

        <div class="polaroid-gallery">
            <div class="polaroid">
                <div class="photo-frame">
                    <img src="photo1.jpg" alt="Our First Date">
                </div>
                <p class="caption">Where it all started...</p>
            </div>

            <div class="polaroid">
                <div class="photo-frame">
                    <img src="photo2.jpg" alt="A Special Moment">
                </div>
                <p class="caption">My favorite smile.</p>
            </div>

            <div class="polaroid">
                <div class="photo-frame">
                    <img src="photo3.jpg" alt="Today">
                </div>
                <p class="caption">To many more months! ❤️</p>
            </div>
        </div>

        <audio id="bgMusic" loop>
            <source src="music.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
